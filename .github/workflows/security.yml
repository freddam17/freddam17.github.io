name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday
  workflow_dispatch:    

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Check if package-lock.json exists
        id: check_files
        run: |
          if [ -f package-lock.json ]; then
            echo "lock_exists=true" >> $GITHUB_OUTPUT
          else
            echo "lock_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate package-lock.json if missing
        if: steps.check_files.outputs.lock_exists == 'false' && hashFiles('package.json') != ''
        run: npm i --package-lock-only
      
      - name: Run npm audit
        if: hashFiles('package.json') != ''
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Run Snyk to check for vulnerabilities
        if: hashFiles('package.json') != ''
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
